<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Blog</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f5f5f5;
        }

        header{
            background:white;
            padding:20px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            box-shadow:0 2px 5px rgba(0,0,0,0.2);
        }

        header h1{
            color:#333;
        }

        nav a{
            text-decoration:none;
            margin-left:20px;
            color:#333;
            font-weight:bold;
        }

        .container{
            width:90%;
            margin:40px auto;

            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:25px;
        }

        .card{
            background:white;
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-10px);
        }

        .card img{
            width:100%;
            height:220px;
            object-fit:cover;
        }

        .card-content{
            padding:15px;
            text-align:center;
        }

        .card-content h2{
            margin-bottom:10px;
            color:#222;
        }

        .card-content p{
            color:#555;
        }

    </style>
</head>

<body>

    <header>
        <h1>My Food Blog</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">Foods</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <div class="container">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836">

            <div class="card-content">
                <h2>Delicious Pasta</h2>
                <p>Tasty Italian pasta with fresh ingredients.</p>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1550547660-d9450f859349">

            <div class="card-content">
                <h2>Cheese Burger</h2>
                <p>Hot burger loaded with cheese and veggies.</p>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c">

            <div class="card-content">
                <h2>Healthy Salad</h2>
                <p>Fresh and healthy salad for a perfect meal.</p>
            </div>
        </div>

    </div>

</body>
</html>
